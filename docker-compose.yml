services:
  postgres:
    image: postgres:15-alpine
    container_name: ideasvault-db
    environment:
      POSTGRES_USER: ideasvault
      POSTGRES_PASSWORD: ideasvault
      POSTGRES_DB: ideasvault
    ports:
      - "5446:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideasvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
